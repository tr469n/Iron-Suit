name: Build Iron Suit mod

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'ironsuit-project-with-ci/ironsuit/**'
      - '.github/workflows/build-mod.yml'
  pull_request:
    paths:
      - 'ironsuit-project-with-ci/ironsuit/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ironsuit-project-with-ci/ironsuit
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build jar
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ironsuit-jar
          path: |
            ironsuit-project-with-ci/ironsuit/build/libs/*.jar
            !ironsuit-project-with-ci/ironsuit/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ironsuit-project-with-ci/ironsuit/build/libs/*.jar
            !ironsuit-project-with-ci/ironsuit/build/libs/*-sources.jar
          generate_release_notes: true
